
# Welcome to your prefect.yaml file!
name: winter-break
prefect-version: 3.6.8

# build section allows you to manage docker images or other assets
build: null

# push section allows you to upload code to S3, GCS, or GitHub
push: null

# pull section defines how the worker gets your code
pull:
- prefect.deployments.steps.git_clone:
    id: clone-step
    repository: https://github.com/jjbokan3/winter_break.git
    branch: main

- prefect.deployments.steps.pip_install_requirements:
    directory: "{{ clone-step.directory }}"
    requirements_file: requirements.txt

# deployment definitions
deployments:
- name: every-5-min
  entrypoint: main.py:my_data_flow
  work_pool:
    name: my-work-pool
    job_variables:
      image: "prefecthq/prefect-client:3-latest"
  schedule:
    cron: "*/5 * * * *"
    timezone: "America/New_York"

- name: assets_demo
  entrypoint: assets_demo.py:assets_demo_flow
  work_pool:
    name: my-work-pool
    job_variables:
      image: "prefecthq/prefect-client:3-latest"
  schedule:
    cron: "*/5 * * * *"
    timezone: "America/New_York"