# Welcome to your prefect.yaml file!
name: winter-break
prefect-version: 3.6.8

# build section allows you to manage docker images or other assets
build: null

# push section allows you to upload code to S3, GCS, or GitHub
push: null

# pull section defines how the worker gets your code
pull:
- prefect.deployments.steps.git_clone:
    repository: https://github.com/jjbokan3/winter_break.git
    branch: main

# deployment definitions
deployments:
- name: my-first-deployment
  entrypoint: main.py:my_flow
  work_pool:
    name: my-work-pool
    work_queue_name: default
  schedule: null