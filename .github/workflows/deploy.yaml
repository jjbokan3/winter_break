name: Deploy Infrastructure & Flows

on:
  push:
    branches:
      - main

jobs:
  infra_and_deploy:
    runs-on: ubuntu-latest
    env:
      # Secrets configured in GitHub Repo Settings
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
      # Adjust this URL to your specific workspace
      PREFECT_API_URL: ${{ secrets.PREFECT_API_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Install Dependencies
        run: uv sync

      - name: Pulumi Up
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: dev
          work-dir: ./pulumi
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      # --- TRICK: Get Pulumi Outputs for the Next Step ---
      - name: Get Pulumi Outputs
        id: pulumi_out
        run: |
          # Use pulumi stack output to get values
          # We use ::add-mask:: to prevent secrets from showing in logs
          
          cd pulumi
          
          ACCESS_KEY=$(pulumi stack output aws_access_key_id --show-secrets)
          echo "::add-mask::$ACCESS_KEY"
          echo "ACCESS_KEY=$ACCESS_KEY" >> $GITHUB_ENV
          
          SECRET_KEY=$(pulumi stack output aws_secret_access_key --show-secrets)
          echo "::add-mask::$SECRET_KEY"
          echo "SECRET_KEY=$SECRET_KEY" >> $GITHUB_ENV
          
          BUCKET_NAME=$(pulumi stack output bucket_name)
          echo "BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV
          
          ECR_REPO_URL=$(pulumi stack output ecr_repo_url)
          echo "ECR_REPO_URL=$ECR_REPO_URL" >> $GITHUB_ENV

      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region us-east-1 | \
            docker login --username AWS --password-stdin ${{ env.ECR_REPO_URL }}

      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG="${{ github.sha }}"
          docker build -t ${{ env.ECR_REPO_URL }}:$IMAGE_TAG .
          docker tag ${{ env.ECR_REPO_URL }}:$IMAGE_TAG ${{ env.ECR_REPO_URL }}:latest
          docker push ${{ env.ECR_REPO_URL }}:$IMAGE_TAG
          docker push ${{ env.ECR_REPO_URL }}:latest
          
          # Make the image tag available for Prefect deploy
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Sync Prefect Blocks
        run: |
          # Pass the env vars we just captured to the python script
          export PULUMI_OUTPUT_ACCESS_KEY="${{ env.ACCESS_KEY }}"
          export PULUMI_OUTPUT_SECRET_KEY="${{ env.SECRET_KEY }}"
          export PULUMI_OUTPUT_BUCKET_NAME="${{ env.BUCKET_NAME }}"
          
          uv run python sync_blocks.py

      - name: Prefect Deploy
        run: uv run prefect deploy --all